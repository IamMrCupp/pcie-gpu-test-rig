name: erc

on:
  push:
  pull_request:

jobs:
  erc:
    runs-on: ubuntu-latest
    # The image runs as a non-root `kicad` user, which can't write the runner's temp files —
    # actions/checkout fails with EACCES before kicad-cli ever runs. The -full image carries
    # the stock symbol libraries; without them ERC flags every symbol as lib_symbol_issues.
    container:
      image: kicad/kicad:10.0.6-full
      options: --user root
    env:
      HOME: /home/kicad   # the image user's config holds the global symbol-library table
    steps:
      - uses: actions/checkout@v5
      - name: Electrical rules check, every severity
        run: kicad-cli sch erc --severity-all --exit-code-violations -o erc.rpt wiring/pcie_rig_power.kicad_sch
      - name: Show the report
        if: always()
        run: cat erc.rpt
      # Renders aren't byte-compared: macOS and this Linux image export different bytes from the
      # same schematic. CI's own renders ride along as an artifact instead.
      - name: Export renders
        run: |
          mkdir -p renders
          kicad-cli sch export pdf -o renders/pcie_rig_power.pdf wiring/pcie_rig_power.kicad_sch
          kicad-cli sch export svg -o renders/ wiring/pcie_rig_power.kicad_sch
      - uses: actions/upload-artifact@v4
        with:
          name: schematic-renders
          path: renders/
